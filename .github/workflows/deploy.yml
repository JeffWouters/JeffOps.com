name: Build and deploy JeffOps.com

on:
  push:
    branches: [main]
  # A pull request is built and verified, never published. The repository uses PRs — a post with
  # thirteen images was merged through one — and until now nothing ran on them at all: the first
  # validation any change got was the push to main that also deployed it.
  pull_request:
    branches: [main]
  workflow_dispatch:
  # A static site has no clock. A post dated next Tuesday only appears if a build
  # runs on or after next Tuesday, so this daily run is the publishing mechanism,
  # not a nicety. It also keeps the security.txt expiry check running: nothing
  # about that file changes on the day it lapses, it simply stops being
  # trustworthy, and verify_build fails once the date is within 30 days.
  #
  # 05:17 UTC is 07:17 in Amsterdam in summer and 06:17 in winter, so a post
  # dated the 17th is live before the working day starts. The odd minute is
  # deliberate: GitHub's scheduler is heavily oversubscribed on the hour and
  # runs booked for :00 are routinely delayed.
  #
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does. If that happens, re-enable it from the
  # Actions tab, or the site simply stops publishing on schedule.
  schedule:
    - cron: '17 5 * * *'

# Read-only by default. pages: write and id-token: write are granted on the deploy job alone,
# because that is the only job that needs them — and because with a pull_request trigger the build
# job now runs against a contributor's branch. A public repository already hands a fork PR a
# read-only token, so this closes nothing that was open; it stops the question arising.
permissions:
  contents: read

# One deploy at a time. Queued runs wait rather than racing each other, but a
# run already in progress is allowed to finish so a deploy is never half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung step otherwise holds a runner for six hours. Every job here finishes in under two
    # minutes; ten is generous enough that a slow pip mirror does not trip it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python build.py --out _site

      # build.py calls write_index_files(), which regenerates blog/index.json, topics.json,
      # series.json and index.js into the SOURCE tree — and those four are tracked. So the build
      # just told us what they should contain, and git can say whether the committed copies agree.
      #
      # The failure this catches is a stale index: a post edited without re-running the generator,
      # so the site's own JSON disagrees with the markdown it came from. The single-page app reads
      # that JSON, so the blog list, the tag filters and the search box would all be serving the
      # previous version of the truth while every page rendered correctly.
      #
      # This could not have been a reliable check until recently. The writes used Path.write_text,
      # which on Windows produced CRLF against a repository holding LF, so a local build dirtied
      # these files every single time and the diff was always non-empty. They are pinned to LF now.
      - name: The committed blog index is what the build produces
        run: git diff --exit-code -- blog/

      - name: Check every post rendered, and security.txt is still valid
        run: python verify_build.py _site

      # Strictly after the verifier, never before. Several of its checks match
      # markup patterns that whitespace collapsing rearranges — running it
      # against a minified build fails on the newsletter archive container —
      # and the TODO(jeff) guard reads HTML comments on purpose, because they
      # are invisible on the page. Strip those first and that guard passes
      # forever without ever having looked at anything.
      - name: Minify the built site
        run: python minify.py _site

      # The artifact that ships is therefore not byte-identical to the one that
      # was verified. That gap is what the post-deploy smoke test covers: it
      # fetches the live origin after the deploy rather than trusting the build.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # Without this, /.well-known/security.txt is stripped from the deploy
          # and the build still goes green. v4 of this action started excluding
          # dotfiles by default; v5 added this input to turn that back off. It
          # covers .nojekyll too. .git and .github are excluded regardless.
          #
          # Quoted deliberately. The action compares this input against the
          # string 'true', and an unquoted YAML boolean is one of the few
          # things that can reach a composite action as something other than
          # the string you expected. After the first deploy /security.txt was
          # live and /.well-known/security.txt was not, which is exactly what
          # this exclusion looks like when it is still being applied.
          include-hidden-files: 'true'

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
      # deploy-pages v4 and later fetch the artifact by ID and need this.
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Nothing above this point looks at the deployed site. verify_build inspects
  # the artifact, not the origin, so a deploy that drops or rewrites a file
  # passes every check and ships green. That is not hypothetical: dotfiles were
  # stripped from the artifact and /.well-known/security.txt was missing from
  # production for two deploys, with three successful runs saying otherwise.
  #
  # This job is the only thing in the pipeline that asks the live site what it
  # is actually serving.
  smoke:
    needs: deploy
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the live site serves what was built
        run: bash tools/smoke_test.sh https://jeffops.com
